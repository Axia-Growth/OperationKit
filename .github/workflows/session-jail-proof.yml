name: Session Jail Proof

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# obj 901348 (CI cost): one run per PR. A new push cancels the previous run
# for the same PR (or ref, for workflow_dispatch). Never a repo-wide group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  jail-proof:
    runs-on: ubuntu-latest
    # obj 901348: typical run is under a minute; two public fork-PR runs hung for
    # 407 and 542 minutes with no job timeout. 20 minutes is a generous ceiling.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Rows 11-13 load the server TS directly via Node 22 type stripping.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Create host decoy (must NOT leak into jail)
        run: |
          sudo mkdir -p /home/operator
          echo DECOY-SHOULD-NOT-LEAK | sudo tee /home/operator/DECOY-ok-jail.txt
          echo "Decoy written:"
          cat /home/operator/DECOY-ok-jail.txt

      - name: Run session jail proof
        run: bash scripts/session-jail-proof.sh
