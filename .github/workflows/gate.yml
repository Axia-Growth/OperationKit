name: gate

# THE single required status check for operationkit.
#
# Why this file exists: before it, the ONLY required context on main was
# `harness/test-agent` — a commit status the Command Center harness posts about
# ITSELF, derived purely from its own AI-review verdict (state-poller.ts
# postHarnessStatus). The genuine signal — the ~2,143-test Vitest suite in
# .github/workflows/test.yml — was advisory and could not block a merge. This
# workflow inverts that: the real suite (plus typecheck and build) is what gates,
# and one aggregate job named exactly `gate` is the only context main requires.
#
# CONTRACT (do not weaken):
#   * Every upstream job must SUCCEED. `skipped` and `cancelled` are FAILURES,
#     not passes. A job that did not run produced no evidence about this diff.
#   * Therefore NO path filters, and NO `if:` on the upstream jobs except ONE
#     exact guard: `if: needs.changes.outputs.docs_only != 'true'`.
#   * DOCS/VAULT-ONLY EXCEPTION (obj 901348, CI cost). The `changes` job runs on
#     every PR and classifies the diff with scripts/ci-docs-only.py (fixture-
#     tested in the same job). Only when EVERY changed path is documentation or
#     vault evidence that no gated test reads, the guarded jobs are skipped, and
#     the gate accepts `skipped` for exactly those jobs. The `gate` context still
#     reports, and succeeds, so a docs-only PR stays mergeable. Workflow files,
#     app code, scripts, install paths, fixtures and docs a test reads always run
#     the full suite. If `changes` fails, the guarded jobs are skipped and the
#     gate goes RED (fail closed); it never reads "no answer" as "docs-only".
#   * The gate job derives its job list from `toJSON(needs)` at runtime and
#     separately asserts that every job declared in this file is present in its
#     `needs:`. A job added here but forgotten in `needs:` fails the gate loudly
#     instead of silently going ungated.
#
# Adding a job: add it below, add it to `gate.needs`. That is all — the assert
# step and the result loop are both derived, so there is no third place to drift.
# Give it the two-line docs-only guard (`needs: changes` + the `if:` above) only
# if a docs/vault-only diff cannot possibly affect it.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Docs/vault-only classifier (obj 901348). Always runs, never skipped. Its
  # output gates the heavy jobs below; see the CONTRACT at the top of this file.
  changes:
    name: changes (docs/vault-only?)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      # A pull_request checkout is the merge commit refs/pull/N/merge: parent 1 is
      # the base tip, so HEAD^1..HEAD is exactly what this PR changes on main.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      # The rule runs against throwaway repos first, so a broken rule fails here
      # instead of silently classifying code as docs.
      - name: Fixture test for the docs-only rule
        run: bash scripts/ci-docs-only-test.sh
      # And the gate's own result logic (lifted from this file): a docs-only PR
      # is green, every way of getting a skip without a docs-only verdict is red.
      - name: Gate result logic on a docs-only diff
        run: python3 scripts/gate-docs-only-test.py
      - name: Classify this PR's diff
        id: classify
        run: |
          set -euo pipefail
          git rev-parse --verify --quiet HEAD^2 >/dev/null || { echo 'FATAL: expected a pull_request merge commit' >&2; exit 1; }
          python3 scripts/ci-docs-only.py HEAD^1 HEAD | tee -a "$GITHUB_OUTPUT"

  typecheck:
    name: typecheck
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # `npm ci` (not `npm install`): app/package-lock.json is now committed, so
      # CI resolves the same tree production does. `--include=dev` is explicit
      # because typescript/vitest are devDependencies and a leaked
      # NODE_ENV=production would silently omit them.
      - run: npm ci --include=dev
      - name: tsc (server)
        run: npx tsc --noEmit -p server/tsconfig.json
      - name: tsc (client)
        run: npx tsc -b --noEmit
        working-directory: app/client

  unit:
    name: unit (${{ matrix.workspace }})
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      # Run both suites even if one fails, so a failure in one is not masked.
      fail-fast: false
      matrix:
        workspace: [server, client]
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --include=dev
      - name: Run Vitest (${{ matrix.workspace }})
        run: npm run test --workspace=${{ matrix.workspace }}

  build:
    name: build
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --include=dev
      # Was entirely unguarded: a PR could break the production Vite/tsc build
      # and nothing in CI would notice until self-deploy served a broken bundle.
      - name: Build client + server
        run: npm run build

  test-integrity:
    name: test-integrity
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The rule lives in a script so it can be fixture-tested; the fixture
      # runs first so a broken rule cannot silently wave a deletion through.
      - name: Fixture test for the test-integrity rule
        run: bash scripts/test-integrity-fixture-test.sh
      - name: No new test skips, no unjustified deleted test files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # Every command's exit code is load-bearing: no error suppression and no
        # tolerated-failure idioms anywhere in this step. If git itself fails
        # (e.g. an unreachable base sha) the step fails and the gate goes red.
        # Fail closed, never fail quiet. A deleted test file is allowed only
        # when the code it tests is deleted in the same PR — see the script.
        run: |
          set -euo pipefail
          python3 scripts/test-integrity.py "$BASE_SHA" "$HEAD_SHA"

  # ===========================================================================
  # THE ONLY REQUIRED CHECK. Context name is exactly `gate` (the job id).
  # ===========================================================================
  shellcheck:
    name: shellcheck (scripts/migrate)
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # Migration scripts run as root against production hosts; keep them lint-clean.
      # shellcheck ships on the ubuntu-latest runner image.
      - name: shellcheck
        run: shellcheck --version && shellcheck -x scripts/migrate/*.sh
      - name: the old-layout backup timer is never installed on an Operation Kit install
        run: bash scripts/migrate/legacy-backup-guard-test.sh

  gitleaks-config:
    name: gitleaks-config (OSS publish allowlist)
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: "8.21.2"   # keep in step with oss-sync.yml
    steps:
      - uses: actions/checkout@v4
      # The OSS publish allowlist (scripts/oss-gitleaks.toml) is only exercised by
      # oss-sync.yml, which runs AFTER merge. This proves on the PR, through the
      # same pinned binary, that the allowlist hides no real-shaped secret.
      - name: Install gitleaks (pinned)
        run: |
          set -euo pipefail
          cd /tmp
          curl -fsSL --retry 3 -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Negative control — allowlist hides no real-shaped secret
        run: bash scripts/oss-gitleaks-config-check.sh scripts/oss-gitleaks.toml

  # Dependency-free prerequisite checker (scripts/setup-check.mjs, ported from
  # public OperationKit #95). Runs on Windows too: the script's whole point is to
  # give a clear answer on hosts that are NOT supported, so its tests must pass there.
  setup-check:
    name: setup-check (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/setup-check.test.mjs
      # Dependency-free SARIF filter used by codeql.yml on PR runs (obj 901854).
      - run: node --test scripts/codeql-drop-suppressed.test.mjs

  gate:
    if: always()
    needs: [changes, typecheck, unit, build, test-integrity, shellcheck, gitleaks-config, setup-check]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # Guards the failure mode that makes an aggregate gate worthless: a job
      # that exists in this workflow but was never added to `gate.needs`, and so
      # can fail while the gate reports green.
      - name: Assert every job in this workflow is in gate.needs
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys, re
          src = open('.github/workflows/gate.yml').read()
          # Job ids are the only keys indented exactly 2 spaces under `jobs:`.
          jobs_block = src.split('\njobs:\n', 1)[1]
          job_ids = re.findall(r'^  ([A-Za-z0-9_-]+):$', jobs_block, re.M)
          needs = re.search(r'^    needs: \[([^\]]+)\]$', jobs_block, re.M)
          if not needs:
              sys.exit('FATAL: could not parse gate.needs from gate.yml')
          declared = [n.strip() for n in needs.group(1).split(',')]
          expected = [j for j in job_ids if j != 'gate']
          missing = [j for j in expected if j not in declared]
          extra   = [n for n in declared if n not in expected]
          print('jobs in file :', expected)
          print('gate.needs   :', declared)
          if missing:
              sys.exit(f'FATAL: job(s) not gated (missing from needs): {missing}')
          if extra:
              sys.exit(f'FATAL: needs names a job that does not exist: {extra}')
          print('OK: gate.needs covers every job in the workflow')
          # obj 901348: the ONLY job-level `if:` allowed upstream of the gate is
          # the exact docs-only guard, always paired with `needs: changes`.
          guard = "    if: needs.changes.outputs.docs_only != 'true'"
          blocks = dict(re.findall(r'^  ([A-Za-z0-9_-]+):$\n(.*?)(?=^  [A-Za-z0-9_-]+:$|\Z)', jobs_block, re.M | re.S))
          for job, body in blocks.items():
              ifs = re.findall(r'^    if: .*$', body, re.M)
              if job == 'gate':
                  continue
              if job == 'changes' and ifs:
                  sys.exit('FATAL: the changes job must never be skipped')
              for line in ifs:
                  if line != guard:
                      sys.exit(f'FATAL: job {job} has a non-standard if: {line!r}')
                  if not re.search(r'^    needs: changes$', body, re.M):
                      sys.exit(f'FATAL: job {job} carries the docs-only guard without needs: changes')
          print('OK: only the docs-only guard is used, always with needs: changes')
          PY

      - name: Assert every upstream job succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          printf '%s\n' "$RESULTS"
          python3 - <<'PY'
          import json, os, re, sys
          results = json.loads(os.environ['RESULTS'])
          if not results:
              sys.exit('FATAL: needs context is empty - gate has no upstream to assert')
          # obj 901348: a guarded job may be `skipped` ONLY when `changes`
          # succeeded AND said docs_only=true. Guarded = carries the exact guard.
          src = open('.github/workflows/gate.yml').read()
          jobs_block = src.split('\njobs:\n', 1)[1]
          blocks = dict(re.findall(r'^  ([A-Za-z0-9_-]+):$\n(.*?)(?=^  [A-Za-z0-9_-]+:$|\Z)', jobs_block, re.M | re.S))
          guard = "    if: needs.changes.outputs.docs_only != 'true'"
          guarded = {j for j, body in blocks.items() if guard in body.splitlines()}
          ch = results.get('changes', {})
          docs_only = ch.get('result') == 'success' and (ch.get('outputs') or {}).get('docs_only') == 'true'
          print(f'docs/vault-only diff: {docs_only}; guarded jobs: {sorted(guarded)}')
          fail = 0
          for job in sorted(results):
              r = results[job]['result']
              if r == 'success':
                  print(f'ok        {job}={r}')
              elif r == 'skipped' and docs_only and job in guarded:
                  print(f'ok        {job}={r} (docs/vault-only diff, by design)')
              elif r == 'skipped':
                  # A skipped job produced NO evidence about this diff. Treating
                  # it as a pass is exactly the decorative-check failure mode
                  # this gate exists to remove.
                  print(f'NO SIGNAL {job}={r} (skipped -> FAILURE)')
                  fail = 1
              elif r == 'cancelled':
                  print(f'NO SIGNAL {job}={r} (cancelled -> FAILURE)')
                  fail = 1
              else:
                  print(f'FAILED    {job}={r}')
                  fail = 1
          sys.exit(fail)
          PY
