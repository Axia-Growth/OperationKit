# ==============================================================================
# Operation Kit — client install stack (used by ./install.sh, never edited by hand)
# ------------------------------------------------------------------------------
# Every host path comes from INSTALL_DIR in the client config (default
# /opt/operationkit) via install.env, written by install.sh. Nothing here names a
# person or a specific server. The repo-root docker-compose.yml is the upstream
# operator's own development layout and is NOT used for client installs.
#
#   $OK_STATE/data  -> /app/data        database, uploads, branding, logs
#   $OK_STATE/home  -> $OK_APP_HOME     the app user's home (projects, notes, memory)
#   $OK_STATE/tmp   -> /tmp             session worktrees + sandbox homes; mapped
#                                       back to host paths for the sandbox via
#                                       SESSION_JAIL_HOST_PATH_MAP
#
# Network: the app is published on two PRIVATE addresses, never 0.0.0.0:
#   127.0.0.1:3002           install/verify.sh and scripts on the server
#   <docker0 gateway>:3002   containers on the default Docker bridge, e.g.
#                            http://172.17.0.1:3002 from a card sandbox (obj 900185)
# install.sh writes OK_DOCKER_BRIDGE_IP (docker0's IPv4; DOCKER_BRIDGE_IP in
# client.conf overrides) and opens 3002 in ufw ONLY for traffic arriving on
# docker0. The docker0 address is not routable from the internet. The public way
# in is the cloudflared connector below, which dials OUT to Cloudflare — the
# firewall keeps 80/443 (and 3002) closed on the public NIC.
#
# Sandboxes (obj 900113): per-session sandbox containers join the `ok-jails`
# bridge, which only the app container shares. Each sandbox forwards its own
# localhost:3002 to command-center:3002 over it, so the ~60 prompt/script call
# sites that say "curl localhost:3002" (AI review criteria, pr-created, ...)
# reach the app. The app treats that subnet as on-box (INTERNAL_TRUSTED_PEER_CIDRS).
#
# Docker API (obj 901741, public issue #97): the app does NOT mount
# /var/run/docker.sock — that socket is the same as host root. The docker-proxy
# sidecar below owns it and serves a filtered Docker API on the private
# `ok-docker-api` network, which only the app shares. The app's docker CLI points
# at it with DOCKER_HOST. The rules (install/docker-proxy/policy.mjs): only the
# endpoints the app uses; a create must be a jail (non-root, CapDrop ALL,
# no-new-privileges, read-only root, binds only inside OK_STATE); no privileged,
# CapAdd, host network/pid/ipc, devices; exec/rm/etc only on containers with
# the ok.objective label. Every call is logged to $OK_DIR/logs/docker-proxy.
# ==============================================================================
name: operationkit

services:
  command-center:
    build:
      context: ../app
      dockerfile: Dockerfile
      args:
        # The commit being installed (install.sh writes it to install.env).
        GIT_SHA: ${OK_GIT_SHA:-unknown}
    image: operationkit-app:local
    # Server code and scripts address the app container by this name.
    container_name: command-center
    command: ["bash", "/app/entrypoint.sh"]
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:3002:3002"
      # Default Docker bridge gateway (obj 900185) — see header. Private, not public.
      - "${OK_DOCKER_BRIDGE_IP:-172.17.0.1}:3002:3002"
    networks:
      - default
      - jails
      # The filtered Docker API (see header). The sandboxes are not on it.
      - docker-api
    depends_on:
      docker-proxy:
        condition: service_healthy
    volumes:
      - ${OK_STATE:?run ./install.sh}/data:/app/data
      - ${OK_STATE}/home:${OK_APP_HOME:?run ./install.sh}
      - ${OK_STATE}/tmp:/tmp
      # No /var/run/docker.sock here (obj 901741): the app reaches Docker only
      # through the docker-proxy sidecar (DOCKER_HOST below).
      # D2 (obj 900540): the secrets-store key-encryption key, read-only, app only.
      # Root-owned mode 400 on the host (install/lib.sh kek_file_ensure). Session
      # sandboxes mount only their own work folder + home, so they never see it.
      - ${OK_KEK_FILE:?run ./install.sh}:/run/secrets/operationkit-secrets-kek:ro
    environment:
      NODE_ENV: production
      PORT: "3002"
      TZ: ${OK_TIMEZONE:-UTC}
      # The app home mounted above (obj 901032): every default path lives under it.
      USER_HOME: ${OK_APP_HOME}
      JWT_SECRET: ${CC_JWT_SECRET:?missing — run ./install.sh}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:?missing — run ./install.sh}
      # D2: the KEK comes from the read-only file above, NOT from an env var, so it
      # cannot leak through a child process environment.
      SECRETS_KEK_PROVIDER: host-file
      SECRETS_KEK_FILE: /run/secrets/operationkit-secrets-kek
      TEST_CRED_ENCRYPTION_KEY: ${TEST_CRED_ENCRYPTION_KEY:?missing — run ./install.sh}
      CORS_ORIGINS: https://${OK_DOMAIN}
      OK_BRAND_NAME: ${OK_BRAND_NAME:-OperationKit}
      # Git identity for commits by sessions whose card owner has not connected
      # GitHub (session-spawn-env.ts resolveFallbackGitIdentity). Empty = no
      # fallback: such a commit fails with a "connect GitHub" message.
      OK_FALLBACK_GIT_NAME: ${OK_FALLBACK_GIT_NAME:-}
      OK_FALLBACK_GIT_EMAIL: ${OK_FALLBACK_GIT_EMAIL:-}
      # The operator's own background jobs; nothing to run on a client install.
      HOST_BOOT_DAEMONS_ENABLED: "false"
      # Image-based install: no live checkout, so the drift guard has nothing to watch.
      DRIFT_GUARD: "off"
      # The filtered Docker API (obj 901741). The docker CLI in this container
      # talks to the sidecar, never to the host socket.
      DOCKER_HOST: tcp://docker-proxy:2375
      # The preview-spool host kick needs a privileged container, which the
      # sidecar refuses; client installs have no preview spool anyway.
      PREVIEW_SPOOL_HOST_KICK: "0"
      # Where the Operation Kit Dev host runner finds this install (must match
      # what the sidecar pins; install.sh writes both from the same values).
      CC_DEV_OPS_SRC_DIR: ${OK_REPO_DIR:-/opt/operationkit-src}
      CC_DEV_OPS_CONFIG: ${OK_CONFIG_FILE:-/opt/operationkit-src/client.conf}
      # Per-session sandbox (app/server/src/services/session-jail.ts).
      SESSION_ISOLATION: ${OK_SESSION_ISOLATION:-docker}
      SESSION_JAIL_IMAGE: ok-jail:local
      # Sandbox /tmp tmpfs size (obj 900402; was a hardcoded 256m) and optional
      # CLAUDE_CODE_TMPDIR on the disk-backed sandbox HOME. Replaces the OVH docker shim.
      SESSION_JAIL_TMP_SIZE: ${OK_JAIL_TMP_SIZE:-2g}
      SESSION_JAIL_CLAUDE_TMPDIR: ${OK_JAIL_CLAUDE_TMPDIR:-}
      SESSION_JAIL_HOST_PATH_MAP: /tmp=${OK_STATE}/tmp,/app/data=${OK_STATE}/data,${OK_APP_HOME}=${OK_STATE}/home
      # Sandboxes reach this app over the ok-jails network (see header, obj 900113).
      SESSION_JAIL_NETWORK: ok-jails
      SESSION_JAIL_CC_UPSTREAM: command-center:3002
      INTERNAL_TRUSTED_PEER_CIDRS: ${OK_JAIL_SUBNET:-172.30.250.0/24}
      # How sandboxed sessions sign in to Claude (sandbox-claude-auth.ts). One of
      # the two is set by install/claude-login.sh; both empty = sessions queue.
      SESSION_JAIL_CLAUDE_OAUTH_TOKEN: ${SESSION_JAIL_CLAUDE_OAUTH_TOKEN:-}
      SESSION_JAIL_ANTHROPIC_API_KEY: ${SESSION_JAIL_ANTHROPIC_API_KEY:-}
      # One login (obj 720332): set by install/cloudflare.sh. Both present = the app
      # verifies Cloudflare Access's signed identity header and skips its own
      # sign-in page. Empty (--skip-cloudflare) = password sign-in only.
      OK_CF_ACCESS_TEAM: ${OK_CF_ACCESS_TEAM:-}
      OK_CF_ACCESS_AUD: ${OK_CF_ACCESS_AUD:-}
      # Card browser lockdown (obj 900024; app/server/src/lib/browser-policy.ts).
      # Defaults here are the LOCKED-DOWN ones: sandbox on, egress guard on,
      # no private network, no cloud metadata. install.sh writes the OK_BROWSER_*
      # values from client.conf; an unset variable keeps the safe default.
      CARD_BROWSER_SANDBOX: ${OK_BROWSER_SANDBOX:-on}
      CARD_BROWSER_EGRESS_GUARD: ${OK_BROWSER_EGRESS_GUARD:-on}
      CARD_BROWSER_ALLOWED_ORIGINS: ${OK_BROWSER_ALLOWED_ORIGINS:-}
      CARD_BROWSER_BLOCKED_ORIGINS: ${OK_BROWSER_BLOCKED_ORIGINS:-}
      CARD_BROWSER_ALLOW_LOOPBACK: ${OK_BROWSER_ALLOW_LOOPBACK:-on}
      CARD_BROWSER_ALLOW_PRIVATE_NETWORK: ${OK_BROWSER_ALLOW_PRIVATE_NETWORK:-off}
      CARD_BROWSER_ALLOW_METADATA: "off"
      OK_DOMAIN: ${OK_DOMAIN:-localhost}
      # Adding a teammate from Settings -> Users (obj 900023). The first three
      # are not secrets (account, app, and the addresses client.conf already
      # listed); OK_CF_ACCESS_API_TOKEN is, and is optional — without it the app
      # neither reads nor writes the Access allow list.
      OK_CF_ACCOUNT_ID: ${OK_CF_ACCOUNT_ID:-}
      OK_CF_ACCESS_APP_ID: ${OK_CF_ACCESS_APP_ID:-}
      OK_CF_ACCESS_PROTECTED_EMAILS: ${OK_CF_ACCESS_PROTECTED_EMAILS:-}
      OK_CF_ACCESS_ALLOWED_DOMAIN: ${OK_CF_ACCESS_ALLOWED_DOMAIN:-}
      OK_CF_ACCESS_API_TOKEN: ${OK_CF_ACCESS_API_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3002/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # The Docker policy sidecar (obj 901741, public issue #97). The ONLY service
  # that holds the host Docker socket. It runs install/docker-proxy/server.mjs
  # (no dependencies) from the app image the installer already builds; the code
  # is mounted read-only from this checkout, which the app container cannot see.
  docker-proxy:
    image: operationkit-app:local
    container_name: ok-docker-proxy
    entrypoint: ["node", "/opt/ok-docker-proxy/server.mjs"]
    command: []
    restart: unless-stopped
    init: true
    # root only to open the socket (root:docker 0660). Every capability is
    # dropped except DAC_READ_SEARCH, which lets it resolve bind sources (realpath)
    # inside OK_STATE folders owned by the app user. Nothing on disk is writable
    # except the audit log folder.
    user: "0:0"
    cap_drop: [ALL]
    cap_add: [DAC_READ_SEARCH]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=16m
    networks:
      - docker-api
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./docker-proxy:/opt/ok-docker-proxy:ro
      # The exact host runner script this checkout ships; the sidecar allows the
      # Dev host runner only with these bytes (and only when HOST_RUNNER=on).
      - ../app/server/src/services/dev-ops/host-runner.sh:/opt/ok-docker-proxy-host-runner.sh:ro
      # The one seccomp profile a jail may ask for (the card-browser jail's).
      - ../app/server/src/lib/jail-browser-seccomp.json:/opt/ok-docker-proxy-seccomp/jail-browser.json:ro
      # Read-only, at the SAME path as on the host, so a bind source is resolved
      # (symlinks followed) exactly where Docker will resolve it.
      - ${OK_STATE}:${OK_STATE}:ro
      - ${OK_DOCKER_PROXY_LOG_DIR:?run ./install.sh}:/var/log/ok-docker-proxy
    environment:
      DOCKER_PROXY_LISTEN: 0.0.0.0:2375
      DOCKER_PROXY_UPSTREAM: /var/run/docker.sock
      DOCKER_PROXY_AUDIT_LOG: /var/log/ok-docker-proxy/audit.jsonl
      DOCKER_PROXY_BIND_ROOTS: ${OK_STATE}
      DOCKER_PROXY_IMAGES: ok-jail:local,ok-jail-browser:local
      DOCKER_PROXY_NETWORKS: ok-jails
      DOCKER_PROXY_NAME_PREFIX: ok-jail-
      DOCKER_PROXY_SECCOMP_PROFILES: /opt/ok-docker-proxy-seccomp/jail-browser.json
      # Operation Kit Dev deploy / Cloudflare tools (privileged host runner).
      # OFF unless client.conf says HOST_RUNNER="on".
      DOCKER_PROXY_HOST_RUNNER: ${OK_DOCKER_PROXY_HOST_RUNNER:-off}
      DOCKER_PROXY_HOST_RUNNER_IMAGE: operationkit-app:local
      DOCKER_PROXY_HOST_RUNNER_SCRIPT: /opt/ok-docker-proxy-host-runner.sh
      DOCKER_PROXY_HOST_RUNNER_SRC: ${OK_REPO_DIR:-/opt/operationkit-src}
      DOCKER_PROXY_HOST_RUNNER_CONF: ${OK_CONFIG_FILE:-/opt/operationkit-src/client.conf}
      DOCKER_PROXY_HOST_RUNNER_DATA: ${OK_STATE}/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:2375/_ping').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - command-center
    # Started only when Cloudflare is set up (install.sh enables the profile).
    profiles: ["tunnel"]

networks:
  # The filtered Docker API (obj 901741): the app and docker-proxy only. Internal:
  # no route out, and no sandbox is ever attached to it.
  docker-api:
    name: ok-docker-api
    driver: bridge
    internal: true
  # Shared ONLY by the app container and the per-session sandboxes (obj 900113).
  # Fixed name: the app passes it to `docker run --network` for each sandbox.
  # Fixed subnet: the app trusts exactly this range as on-box callers.
  jails:
    name: ok-jails
    driver: bridge
    ipam:
      config:
        - subnet: ${OK_JAIL_SUBNET:-172.30.250.0/24}
