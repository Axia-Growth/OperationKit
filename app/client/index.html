<!DOCTYPE html>
<html lang="en" class="h-full bg-surface" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f8fa" />
    <!-- Replaced server-side with the install's own favicon + name (routes/branding.ts renderBrandedIndex). -->
    <link rel="icon" href="/api/branding/favicon" />
    <title>Operation Kit</title>
    <!--
      App-shell skeleton (obj 700585). This inline critical CSS + markup paints an
      instant neutral shell skeleton on the very first frame — before the JS bundle
      downloads, parses, and mounts React. It is the pragmatic "pre-render" that
      delivers the perceived-load win people reach SSR for, at near-zero cost:
      createRoot(#root).render() clears #root on mount, so this skeleton is
      replaced by the real app the moment React takes over. Colours are the shipped
      design tokens (surface/line/fg/accent) hard-coded here because index.html has
      no Tailwind runtime; they mirror tailwind.config.ts exactly.
    -->
    <style>
      /* Colors mirror the neutral LIGHT defaults (obj 900750) (index.css / tailwind.config.ts)
         hard-coded here because this paints before Tailwind/CSS vars are ready. */
      #app-shell { height: 100%; display: flex; flex-direction: column; background: #f6f8fa; }
      #app-shell * { box-sizing: border-box; }
      .as-topbar {
        height: 48px; flex: 0 0 auto; display: flex; align-items: center; gap: 14px;
        padding: 0 16px; border-bottom: 1px solid #d1d9e0; background: #f6f8fa;
      }
      /* Neutral logo placeholder — never a brand glyph (white-label, obj 900543). */
      .as-mark {
        width: 28px; height: 28px; border-radius: 6px; background: #e6eaef; flex: 0 0 auto;
      }
      .as-pill { height: 12px; border-radius: 4px; background: #e6eaef; }
      .as-avatar { width: 28px; height: 28px; border-radius: 999px; margin-left: auto; flex: 0 0 auto; }
      .as-page {
        flex: 1 1 auto; width: 100%; max-width: 1024px; margin: 0 auto; display: flex;
        flex-direction: column; gap: 24px; padding: 24px; overflow: hidden;
      }
      .as-head { display: flex; flex-direction: column; gap: 8px; }
      .as-card {
        display: flex; flex-direction: column; gap: 9px; padding: 16px; border-radius: 6px;
        border: 1px solid #d1d9e0; background: #ffffff;
      }
      .as-line { height: 11px; border-radius: 3px; background: #e6eaef; }
      .as-shimmer {
        position: relative; overflow: hidden;
        background: linear-gradient(90deg, #e6eaef 0%, #d1d9e0 50%, #e6eaef 100%);
        background-size: 200% 100%; animation: as-pulse 1.4s ease-in-out infinite;
      }
      @keyframes as-pulse { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
      @media (prefers-reduced-motion: reduce) { .as-shimmer { animation: none; } }
      @media (max-width: 640px) { .as-page { padding: 16px; } }
      /* Dark-theme skeleton (localStorage 'ok-theme'='dark', read inline below). */
      html[data-theme="dark"] #app-shell { background: #0d1117; }
      html[data-theme="dark"] .as-topbar { background: #0d1117; border-bottom-color: #3d444d; }
      html[data-theme="dark"] .as-mark { background: #212830; }
      html[data-theme="dark"] .as-pill,
      html[data-theme="dark"] .as-line { background: #212830; }
      html[data-theme="dark"] .as-card { background: #151b23; border-color: #3d444d; }
      html[data-theme="dark"] .as-shimmer { background: linear-gradient(90deg, #212830 0%, #3d444d 50%, #212830 100%); background-size: 200% 100%; }
      @media (prefers-color-scheme: dark) {
        html[data-theme="auto"] #app-shell { background: #0d1117; }
        html[data-theme="auto"] .as-topbar { background: #0d1117; border-bottom-color: #3d444d; }
        html[data-theme="auto"] .as-mark { background: #212830; }
        html[data-theme="auto"] .as-pill,
        html[data-theme="auto"] .as-line { background: #212830; }
        html[data-theme="auto"] .as-card { background: #151b23; border-color: #3d444d; }
      }
    </style>
    <!-- Pre-paint theme (see public/theme-init.js). A same-origin file, never an
         inline script: the CSP is script-src 'self' (obj 901199). Not async/defer
         and not a module, so it runs before the skeleton paints. -->
    <script src="/theme-init.js"></script>
  </head>
  <body class="h-full text-fg-0">
    <div id="root" class="h-full">
      <!-- Instant app shell — swapped out when React mounts (obj 700585).
           Neutral on purpose (polish F8): auth is unknown here, so this must not
           look like the board (a logged-out visitor's next frame is the login
           card; a deep link may be /settings). App.tsx's AppShellSkeleton keeps
           the same layout until /api/auth/me answers. -->
      <div id="app-shell" aria-hidden="true">
        <div class="as-topbar">
          <div class="as-mark"></div>
          <div class="as-pill as-shimmer" style="width:96px"></div>
          <div class="as-avatar as-shimmer"></div>
        </div>
        <div class="as-page">
          <div class="as-head">
            <div class="as-line as-shimmer" style="width:176px;height:20px"></div>
            <div class="as-line as-shimmer" style="width:288px;max-width:100%;height:12px"></div>
          </div>
          <div class="as-card"><div class="as-line as-shimmer"></div><div class="as-line as-shimmer"></div><div class="as-line as-shimmer" style="width:40%"></div></div>
          <div class="as-card"><div class="as-line as-shimmer"></div><div class="as-line as-shimmer" style="width:40%"></div></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
